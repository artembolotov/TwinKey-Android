name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks
          cat > keystore.properties << EOF
          storeFile=${{ github.workspace }}/keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # Раннер уже несёт установленный NDK — сообщаем его версию сборке, чтобы AGP
      # не скачивал свою для извлечения нативных отладочных символов (debugSymbolLevel).
      - name: Resolve installed NDK version
        run: |
          ndk_dir="${ANDROID_NDK_ROOT:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -d "$ndk_dir" ]; then
            echo "ANDROID_NDK_VERSION=$(basename "$ndk_dir")" >> "$GITHUB_ENV"
          else
            echo "NDK не найден на раннере, AGP скачает свою версию"
          fi

      - name: Build release AAB and APK
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease -PversionCode=${{ github.run_number }} -PappmetricaApiKey=${{ secrets.APPMETRICA_API_KEY }}

      - name: Upload to Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.artembolotov.twinkey
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: internal

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release.aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release.apk
          path: app/build/outputs/apk/release/app-release.apk

      # Без mapping.txt стектрейсы из AppMetrica нечитаемы: там одни co4.b/cf4.a.
      # Заодно забираем отчёты R8 — usage.txt показывает, что именно вырезано,
      # configuration.txt — итоговый набор правил со всеми consumer-правилами библиотек.
      - name: Upload R8 mapping and reports
        uses: actions/upload-artifact@v7
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/
